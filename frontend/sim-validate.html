<!DOCTYPE html>
<html lang="en" data-page="validate">
<head>
<script src="/wails/ipc.js"></script>
<script src="/wails/runtime.js"></script>
<meta charset="UTF-8">
<title>Validate — Device Simulator</title>
<script src="sim-state.js"></script>
<script src="sim-nav.js"></script>
<style>
.app-wrap{flex-direction:column!important}

/* ── Header bar ── */
.page-hdr{background:var(--bg1);border-bottom:1px solid var(--border);padding:0 16px;height:52px;display:flex;align-items:center;gap:10px;flex-shrink:0}
.ph-title{font-size:13px;font-weight:700;color:var(--t0);line-height:1.2}.ph-title span{color:var(--blue)}
.ph-sub{font-size:10px;color:var(--t2);font-family:var(--font-mono);margin-top:1px}
.sp{flex:1}
.ph-btn{padding:5px 13px;border-radius:var(--btn-radius,5px);font-size:10px;font-weight:700;cursor:pointer;background:var(--bg2);border:1px solid var(--border);color:var(--t1);transition:all .12s;white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.ph-btn:hover{background:var(--bg3);color:var(--t0);border-color:var(--border-strong)}
.ph-btn.primary{background:var(--blue);color:#06201D;border-color:var(--blue)}.ph-btn.primary:hover{filter:brightness(1.1);box-shadow:0 2px 10px rgba(46,196,182,.3)}
.ph-btn:disabled{opacity:.38;cursor:not-allowed;pointer-events:none}
.ph-spinner{display:none;width:13px;height:13px;border:2px solid var(--border-strong);border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite}
.ph-spinner.on{display:block}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── Summary cards ── */
.sum-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:12px 16px;background:var(--bg0);border-bottom:1px solid var(--border);flex-shrink:0}
.sc{background:var(--bg1);border:1px solid var(--border);border-radius:9px;padding:14px 16px 12px;display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden;transition:border-color .2s,box-shadow .2s}
.sc::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--border-strong);border-radius:9px 0 0 9px;transition:background .2s}
.sc.match{border-color:rgba(91,210,138,.25);box-shadow:0 0 0 0 rgba(91,210,138,.0)}.sc.match::before{background:var(--green)}
.sc.diff{border-color:rgba(242,169,59,.25)}.sc.diff::before{background:var(--yellow)}
.sc.miss{border-color:rgba(248,113,113,.25)}.sc.miss::before{background:var(--red)}
.sc-hdr{display:flex;align-items:center;gap:7px;padding-left:8px}
.sc-icon{width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sc.match .sc-icon{background:rgba(91,210,138,.1);color:var(--green)}
.sc.diff .sc-icon{background:rgba(242,169,59,.1);color:var(--yellow)}
.sc.miss .sc-icon{background:rgba(248,113,113,.1);color:var(--red)}
.sc-icon-default{background:var(--bg2);color:var(--t2)}
.sc-meta{display:flex;flex-direction:column;gap:1px}
.sc-title{font-size:10px;font-weight:700;color:var(--t0);letter-spacing:.01em}
.sc-subtitle{font-size:8px;color:var(--t2)}
.sc-body{display:flex;align-items:center;gap:0;padding-left:8px}
.sc-pair{flex:1;display:flex;flex-direction:column;gap:3px}
.sc-lbl{font-size:8px;font-weight:700;color:var(--t2);text-transform:uppercase;letter-spacing:.06em;display:flex;align-items:center;gap:4px}
.sc-lbl-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0}
.sc-num{font-size:26px;font-weight:800;font-family:var(--font-mono);line-height:1;color:var(--t0);letter-spacing:-.02em}
.sc-vsep{width:1px;height:38px;background:var(--border);margin:0 14px;flex-shrink:0}
.sc-diff-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:52px;gap:3px;flex-shrink:0;padding-left:6px}
.sc-diff-lbl{font-size:7px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--t2)}
.sc-diff{font-size:12px;font-weight:800;padding:3px 10px;border-radius:5px;text-align:center;white-space:nowrap}
.sc-diff.ok{background:rgba(91,210,138,.12);color:var(--green);border:1px solid rgba(91,210,138,.2)}
.sc-diff.warn{background:rgba(242,169,59,.12);color:var(--yellow);border:1px solid rgba(242,169,59,.2)}
.sc-diff.bad{background:rgba(248,113,113,.12);color:var(--red);border:1px solid rgba(248,113,113,.2)}

/* ── Tabs ── */
.tabs{display:flex;border-bottom:1px solid var(--border);background:var(--bg1);padding:0 16px;flex-shrink:0;gap:2px}
.tab{padding:10px 16px;font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;cursor:pointer;color:var(--t2);border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .12s;white-space:nowrap}
.tab:hover{color:var(--t1)}.tab.on{color:var(--blue);border-bottom-color:var(--blue)}

/* ── Filter bar ── */
.filter-bar{display:flex;align-items:center;gap:8px;padding:8px 16px;border-bottom:1px solid var(--border);background:var(--bg1);flex-shrink:0;flex-wrap:wrap}
.fb-lbl{font-size:8px;font-weight:800;color:var(--t2);text-transform:uppercase;letter-spacing:.07em;flex-shrink:0}
.fb-chips{display:flex;gap:4px;align-items:center}
.chip{padding:3px 10px;border-radius:20px;font-size:9px;font-weight:700;cursor:pointer;background:var(--bg2);border:1px solid var(--border);color:var(--t2);transition:all .14s;display:inline-flex;align-items:center;gap:5px;user-select:none}
.chip:hover{border-color:var(--border-strong);color:var(--t1)}
.chip-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0}
.chip.on{border-color:var(--blue);color:var(--blue);background:rgba(46,196,182,.1)}
.chip.src.on{background:rgba(129,140,248,.1);border-color:#818cf8;color:#818cf8}
.chip.src .chip-dot{background:#818cf8}
.chip.tgt.on{background:rgba(91,210,138,.1);border-color:var(--green);color:var(--green)}
.chip.tgt .chip-dot{background:var(--green)}
.fb-sep{width:1px;height:16px;background:var(--border);flex-shrink:0;margin:0 2px}
.fb-search-wrap{flex:1;min-width:120px;max-width:260px;display:flex;align-items:center;background:var(--bg2);border:1px solid var(--border);border-radius:6px;padding:0 8px;gap:5px;transition:border-color .14s}
.fb-search-wrap:focus-within{border-color:var(--blue);background:var(--bg3)}
.fb-search-wrap svg{flex-shrink:0;color:var(--t2)}
.fb-search{flex:1;background:none;border:none;color:var(--t0);font-size:10px;outline:none;padding:4px 0;font-family:var(--font-ui)}

/* ── Table area ── */
.tbl-wrap{flex:1;overflow:auto}
.tbl-wrap::-webkit-scrollbar{width:4px;height:4px}.tbl-wrap::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
table.dtbl{width:100%;border-collapse:collapse;font-size:10px}
table.dtbl th{position:sticky;top:0;padding:6px 12px;text-align:left;font-size:8px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--t2);background:var(--bg1);border-bottom:1px solid var(--border);white-space:nowrap;cursor:pointer;user-select:none}
table.dtbl th:hover{color:var(--t0)}
table.dtbl th.asc::after{content:' ▲';font-size:7px}
table.dtbl th.desc::after{content:' ▼';font-size:7px}
table.dtbl td{padding:6px 12px;border-bottom:1px solid var(--border-subtle);color:var(--t1);vertical-align:top;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
table.dtbl tr:hover td{background:var(--bg2);color:var(--t0)}
table.dtbl td.mono{font-family:var(--font-mono);color:var(--t0)}
table.dtbl td.src{color:#818cf8}table.dtbl td.tgt{color:var(--green)}
table.dtbl td.match{color:var(--green)}.dtbl td.diff{color:var(--yellow)}.dtbl td.bad{color:var(--red)}

/* Expandable raw JSON */
.exp-btn{font-size:8px;color:var(--blue);cursor:pointer;padding:1px 5px;border-radius:3px;opacity:.7;user-select:none;border:1px solid var(--border);background:var(--bg2);font-family:var(--font-mono)}
.exp-btn:hover{opacity:1;border-color:var(--blue)}
.exp-row td{padding:0 12px 8px!important;max-width:none!important;overflow:visible!important;white-space:normal!important}
.exp-pre{font-size:9px;font-family:var(--font-mono);color:var(--t1);background:var(--bg0);border:1px solid var(--border);border-radius:5px;padding:10px 12px;white-space:pre-wrap;word-break:break-all;max-height:300px;overflow-y:auto;margin:0}

/* ── Footer bar ── */
.ftr{display:flex;align-items:center;gap:6px;padding:7px 16px;border-top:1px solid var(--border);background:var(--bg1);flex-shrink:0}
.ftr-info{font-size:9px;color:var(--t2);flex:1;font-family:var(--font-mono)}
.ftr-btn{padding:4px 11px;border-radius:var(--btn-radius,5px);font-size:9px;font-weight:700;cursor:pointer;background:var(--bg2);border:1px solid var(--border);color:var(--t1);transition:all .12s;display:inline-flex;align-items:center;gap:4px}
.ftr-btn:hover{background:var(--bg3);color:var(--t0);border-color:var(--border-strong)}

/* ── Empty / error states ── */
.empty{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;flex:1;color:var(--t2);font-size:11px;padding:40px}
.empty-icon{font-size:28px;opacity:.3}
.err-banner{background:rgba(248,113,113,.07);border:1px solid rgba(248,113,113,.22);border-radius:6px;padding:9px 13px;font-size:10px;color:var(--red);margin:10px 16px;display:flex;align-items:center;gap:7px}

/* ── Alert type filter panel ── */
.type-filter{padding:10px 16px;border-bottom:1px solid var(--border);background:var(--bg0)}
.tf-hdr{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.tf-title{font-size:8px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--t2)}
.tf-all{padding:3px 11px;border-radius:20px;font-size:8px;font-weight:700;cursor:pointer;background:var(--bg2);border:1px solid var(--border);color:var(--t2);transition:all .12s;display:inline-flex;align-items:center;gap:4px}
.tf-all.on{background:rgba(46,196,182,.1);border-color:var(--blue);color:var(--blue)}
.tf-all:hover{color:var(--t0);border-color:var(--border-strong)}
.bkd-grid{display:flex;flex-wrap:wrap;gap:5px}
.bkd-row{display:flex;align-items:center;gap:6px;padding:5px 10px;background:var(--bg1);border:1px solid var(--border);border-radius:6px;font-size:9px;cursor:pointer;transition:all .13s;user-select:none}
.bkd-row:hover{background:var(--bg2);border-color:var(--border-strong)}
.bkd-row.sel{background:rgba(46,196,182,.07);border-color:rgba(46,196,182,.4)}
.bkd-type{color:var(--t1);font-weight:600;font-size:9px}.bkd-row.sel .bkd-type{color:var(--blue)}
.bkd-counts{display:flex;align-items:center;gap:3px;background:var(--bg2);border-radius:4px;padding:1px 5px}
.bkd-row.sel .bkd-counts{background:rgba(46,196,182,.08)}
.bkd-src{color:#818cf8;font-family:var(--font-mono);font-size:8px;font-weight:700}
.bkd-tgt{color:var(--green);font-family:var(--font-mono);font-size:8px;font-weight:700}
.bkd-sep{color:var(--border-strong);font-size:9px;line-height:1}
.bkd-d{font-family:var(--font-mono);font-size:8px;font-weight:700;padding:1px 5px;border-radius:3px}
.bkd-d.ok{background:rgba(91,210,138,.1);color:var(--green)}
.bkd-d.warn{background:rgba(242,169,59,.1);color:var(--yellow)}
.bkd-d.bad{background:rgba(248,113,113,.1);color:var(--red)}
</style>
</head>
<body>
<div class="app-wrap">
<!-- Wails injects sim-nav.js side-nav here -->

<div class="page-hdr">
  <svg width="15" height="15" viewBox="0 0 15 15" fill="none" stroke="var(--blue)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><polyline points="2,8 6,12 13,4"/></svg>
  <div>
    <div class="ph-title">Sim <span>Validate</span></div>
    <div class="ph-sub" id="phSub">Loading…</div>
  </div>
  <div class="sp"></div>
  <div class="ph-spinner" id="phSpinner"></div>
  <button class="ph-btn primary" id="reCheckBtn" onclick="reCheck()" disabled>
    <svg width="10" height="10" viewBox="0 0 18 18" fill="currentColor"><polygon points="4,2 16,9 4,16"/></svg>Re-Check
  </button>
  <button class="ph-btn" onclick="history.back()">
    <svg width="10" height="10" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="11,4 5,9 11,14"/></svg>Back
  </button>
</div>

<!-- Summary -->
<div class="sum-row" id="sumRow">
  <div class="sc" id="scTrips">
    <div class="sc-hdr">
      <div class="sc-icon sc-icon-default">
        <svg width="14" height="14" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9h12M3 9l4-4M3 9l4 4M15 9l-4-4M15 9l-4 4"/></svg>
      </div>
      <div class="sc-meta">
        <div class="sc-title">Trips</div>
        <div class="sc-subtitle">Route comparisons</div>
      </div>
    </div>
    <div class="sc-body">
      <div class="sc-pair">
        <span class="sc-lbl"><span class="sc-lbl-dot" style="background:#818cf8"></span>Source</span>
        <span class="sc-num" id="scSrcTrips">—</span>
      </div>
      <div class="sc-vsep"></div>
      <div class="sc-pair">
        <span class="sc-lbl"><span class="sc-lbl-dot" style="background:var(--green)"></span>Target</span>
        <span class="sc-num" id="scTgtTrips">—</span>
      </div>
      <div class="sc-diff-wrap">
        <span class="sc-diff-lbl">Delta</span>
        <span class="sc-diff" id="scTripsDiff"></span>
      </div>
    </div>
  </div>
  <div class="sc" id="scAlerts">
    <div class="sc-hdr">
      <div class="sc-icon sc-icon-default">
        <svg width="14" height="14" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 2a5 5 0 0 1 5 5v3l1.5 2.5H2.5L4 10V7a5 5 0 0 1 5-5z"/><path d="M7 14.5a2 2 0 0 0 4 0"/></svg>
      </div>
      <div class="sc-meta">
        <div class="sc-title">Alerts</div>
        <div class="sc-subtitle">Event comparisons</div>
      </div>
    </div>
    <div class="sc-body">
      <div class="sc-pair">
        <span class="sc-lbl"><span class="sc-lbl-dot" style="background:#818cf8"></span>Source</span>
        <span class="sc-num" id="scSrcAlerts">—</span>
      </div>
      <div class="sc-vsep"></div>
      <div class="sc-pair">
        <span class="sc-lbl"><span class="sc-lbl-dot" style="background:var(--green)"></span>Target</span>
        <span class="sc-num" id="scTgtAlerts">—</span>
      </div>
      <div class="sc-diff-wrap">
        <span class="sc-diff-lbl">Delta</span>
        <span class="sc-diff" id="scAlertsDiff"></span>
      </div>
    </div>
  </div>
  <div class="sc" id="scDtcs">
    <div class="sc-hdr">
      <div class="sc-icon sc-icon-default">
        <svg width="14" height="14" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="9" r="7"/><line x1="9" y1="5.5" x2="9" y2="9.5"/><circle cx="9" cy="12" r=".7" fill="currentColor"/></svg>
      </div>
      <div class="sc-meta">
        <div class="sc-title">DTCs</div>
        <div class="sc-subtitle">Fault code comparisons</div>
      </div>
    </div>
    <div class="sc-body">
      <div class="sc-pair">
        <span class="sc-lbl"><span class="sc-lbl-dot" style="background:#818cf8"></span>Source</span>
        <span class="sc-num" id="scSrcDtcs">—</span>
      </div>
      <div class="sc-vsep"></div>
      <div class="sc-pair">
        <span class="sc-lbl"><span class="sc-lbl-dot" style="background:var(--green)"></span>Target</span>
        <span class="sc-num" id="scTgtDtcs">—</span>
      </div>
      <div class="sc-diff-wrap">
        <span class="sc-diff-lbl">Delta</span>
        <span class="sc-diff" id="scDtcsDiff"></span>
      </div>
    </div>
  </div>
</div>

<!-- Error banner -->
<div class="err-banner" id="errBanner" style="display:none"></div>

<!-- Tabs -->
<div class="tabs">
  <span class="tab on" id="tabTrips"  onclick="switchTab('trips')">Trips</span>
  <span class="tab"    id="tabAlerts" onclick="switchTab('alerts')">Alerts</span>
  <span class="tab"    id="tabDtcs"   onclick="switchTab('dtcs')">DTCs</span>
</div>

<!-- Filter bar -->
<div class="filter-bar" id="filterBar">
  <span class="fb-lbl">Show</span>
  <div class="fb-chips">
    <span class="chip src on" id="fSrc" onclick="toggleFilter('src',this)">
      <span class="chip-dot"></span>Source
    </span>
    <span class="chip tgt on" id="fTgt" onclick="toggleFilter('tgt',this)">
      <span class="chip-dot"></span>Target
    </span>
  </div>
  <div class="fb-sep"></div>
  <div class="fb-search-wrap">
    <svg width="12" height="12" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="7.5" cy="7.5" r="5"/><line x1="11.5" y1="11.5" x2="15.5" y2="15.5"/></svg>
    <input class="fb-search" id="fbSearch" type="text" placeholder="Search rows…" oninput="applyFilters()">
  </div>
  <div class="sp"></div>
</div>

<!-- Alert type filters (alerts tab only) -->
<div class="type-filter" id="breakdownPanel" style="display:none">
  <div class="tf-hdr">
    <span class="tf-title">Filter by Type</span>
    <span class="tf-all" id="tfAll" onclick="clearTypeFilter()">All</span>
  </div>
  <div class="bkd-grid" id="bkdGrid"></div>
</div>

<!-- Table -->
<div class="tbl-wrap" id="tblWrap">
  <div class="empty" id="emptyState">
    <div class="empty-icon">◎</div>
    <span>No validation data — go back and click Check</span>
  </div>
</div>

<!-- Footer -->
<div class="ftr">
  <span class="ftr-info" id="ftrInfo"></span>
  <button class="ftr-btn" onclick="exportData('csv')">
    <svg width="10" height="10" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="9" y1="2" x2="9" y2="12"/><polyline points="5,8 9,12 13,8"/><line x1="3" y1="16" x2="15" y2="16"/></svg>CSV
  </button>
  <button class="ftr-btn" onclick="exportData('json')">
    <svg width="10" height="10" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="9" y1="2" x2="9" y2="12"/><polyline points="5,8 9,12 13,8"/><line x1="3" y1="16" x2="15" y2="16"/></svg>JSON
  </button>
</div>
</div>

<script>
'use strict';
let _result = null;
let _activeTab = 'trips';
let _showSrc = true, _showTgt = true;
let _sortCol = null, _sortDir = 1;
let _search = '';
let _activeTypes = null; // null = all; Set = only these alert types

// ── Load saved result ─────────────────────────────────────────
function loadResult() {
  try {
    const raw = localStorage.getItem('sim_val_result');
    if (raw) {
      _result = JSON.parse(raw);
      applyResult();
    }
  } catch(e) {}
}

function applyResult() {
  if (!_result) return;
  const t = SimState.getActiveTest(), r = SimState.getRegion(SimState.getActiveRegionKey());
  const checkedAt = _result.checkedAt ? new Date(_result.checkedAt).toLocaleString() : '';
  const testName = t ? t.name : 'Unknown Test';
  const src = _result.src || {}, tgt = _result.tgt || {};
  document.getElementById('phSub').textContent =
    testName + ' · ' + fmtMs(t && t.from) + ' → ' + fmtMs(t && t.until) + ' · Checked ' + checkedAt;

  // Summary cards
  renderSummaryCard('Trips',  'scTrips',  src.tripCount||0,  tgt.tripCount||0);
  renderSummaryCard('Alerts', 'scAlerts', src.alertCount||0, tgt.alertCount||0);
  renderSummaryCard('DTCs',   'scDtcs',   (src.dtcActiveCount||0)+(src.dtcInactiveCount||0),   (tgt.dtcActiveCount||0)+(tgt.dtcInactiveCount||0));

  // Error banner
  const errs = [...(src.errors||[]),...(tgt.errors||[])];
  if (_result.error) errs.unshift(_result.error);
  if (errs.length) {
    document.getElementById('errBanner').style.display = '';
    document.getElementById('errBanner').textContent = errs.join(' | ');
  } else {
    document.getElementById('errBanner').style.display = 'none';
  }

  // Enable re-check if we have the minimum: userToken (accId is auto-resolved from IMEI)
  if (r && r.userToken) document.getElementById('reCheckBtn').disabled = false;

  renderTab();
}

function renderSummaryCard(title, id, srcN, tgtN) {
  const d = tgtN - srcN;
  const cls = d === 0 ? 'ok' : (Math.abs(d) <= 2 ? 'warn' : 'bad');
  const el = document.getElementById(id);
  if (!el) return;
  const scState = cls === 'ok' ? 'match' : cls === 'warn' ? 'diff' : 'miss';
  el.className = 'sc ' + scState;
  const iconEl = el.querySelector('.sc-icon');
  if (iconEl) iconEl.className = 'sc-icon';
  const srcEl = document.getElementById(id.replace('sc','sc') + 'Src' + title.charAt(0).toUpperCase() + title.slice(1).replace('s','s'));
  // Use named IDs
  const map = {scTrips:['scSrcTrips','scTgtTrips','scTripsDiff'],scAlerts:['scSrcAlerts','scTgtAlerts','scAlertsDiff'],scDtcs:['scSrcDtcs','scTgtDtcs','scDtcsDiff']};
  const ids = map[id];
  if (!ids) return;
  document.getElementById(ids[0]).textContent = srcN;
  document.getElementById(ids[1]).textContent = tgtN;
  const diffEl = document.getElementById(ids[2]);
  diffEl.className = 'sc-diff ' + cls;
  diffEl.textContent = d === 0 ? '✓ Match' : (d > 0 ? '+' : '') + d;
}

// ── Tab switching ─────────────────────────────────────────────
function switchTab(tab) {
  _activeTab = tab;
  _sortCol = null; _sortDir = 1; _search = '';
  _activeTypes = null;
  document.getElementById('fbSearch').value = '';
  ['trips','alerts','dtcs'].forEach(t => {
    document.getElementById('tab' + t.charAt(0).toUpperCase() + t.slice(1)).classList.toggle('on', t === tab);
  });
  document.getElementById('breakdownPanel').style.display = tab === 'alerts' ? '' : 'none';
  renderTab();
}

function toggleTypeFilter(type) {
  if (_activeTypes === null) {
    _activeTypes = new Set([type]);
  } else if (_activeTypes.has(type)) {
    _activeTypes.delete(type);
    if (_activeTypes.size === 0) _activeTypes = null;
  } else {
    _activeTypes.add(type);
  }
  renderTab();
}

function clearTypeFilter() {
  _activeTypes = null;
  renderTab();
}

function toggleFilter(side, el) {
  if (side === 'src') _showSrc = !_showSrc;
  else _showTgt = !_showTgt;
  if (!_showSrc && !_showTgt) { _showSrc = true; _showTgt = true; } // prevent all hidden
  document.getElementById('fSrc').classList.toggle('on', _showSrc);
  document.getElementById('fTgt').classList.toggle('on', _showTgt);
  applyFilters();
}

function applyFilters() {
  _search = document.getElementById('fbSearch').value.toLowerCase().trim();
  renderTab();
}

function renderTab() {
  if (!_result) return;
  const src = _result.src || {}, tgt = _result.tgt || {};
  if (_activeTab === 'trips')  renderTrips(src.trips||[], tgt.trips||[]);
  if (_activeTab === 'alerts') renderAlerts(src.alerts||[], tgt.alerts||[], src.alertsByType||{}, tgt.alertsByType||{});
  if (_activeTab === 'dtcs')   renderDtcs(src.dtcsActive||[], src.dtcsInactive||[], tgt.dtcsActive||[], tgt.dtcsInactive||[]);
}

// ── Sort helper ───────────────────────────────────────────────
function thClick(col) {
  if (_sortCol === col) _sortDir *= -1;
  else { _sortCol = col; _sortDir = 1; }
  renderTab();
}

function sortRows(rows, col) {
  if (!col) return rows;
  return [...rows].sort((a, b) => {
    let av = a[col], bv = b[col];
    if (typeof av === 'string') av = av.toLowerCase();
    if (typeof bv === 'string') bv = bv.toLowerCase();
    if (av == null) av = -Infinity;
    if (bv == null) bv = -Infinity;
    return av < bv ? -_sortDir : av > bv ? _sortDir : 0;
  });
}

function thCls(col) { return _sortCol === col ? (_sortDir === 1 ? 'asc' : 'desc') : ''; }

// ── Trips ─────────────────────────────────────────────────────
function tripDistKm(r) {
  // distance is typically in metres; odo_distance / distance_km may be in km
  const m = r.distance || r.odo_distance_m || r.distance_m;
  if (m != null && m > 0) return (m / 1000).toFixed(2) + ' km';
  const km = r.distance_km || r.odo_distance || r.total_distance;
  if (km != null && km > 0) return Number(km).toFixed(2) + ' km';
  return '—';
}
function tripDurMs(r) {
  if (r.duration_ms != null && r.duration_ms > 0) return r.duration_ms;
  // duration is typically in seconds
  if (r.duration != null && r.duration > 0) return r.duration * 1000;
  if (r.trip_duration != null && r.trip_duration > 0) return r.trip_duration * 1000;
  return 0;
}

function renderTrips(srcTrips, tgtTrips) {
  let rows = [
    ...srcTrips.map(r => ({ ...r, _side: 'src' })),
    ...tgtTrips.map(r => ({ ...r, _side: 'tgt' })),
  ];
  rows = rows.filter(r => {
    if (!_showSrc && r._side === 'src') return false;
    if (!_showTgt && r._side === 'tgt') return false;
    if (_search) {
      const hay = JSON.stringify(r).toLowerCase();
      if (!hay.includes(_search)) return false;
    }
    return true;
  });
  rows = sortRows(rows, _sortCol || 'start_time');
  if (!rows.length) { showEmpty(); return; }

  const thead = `<tr>
    <th onclick="thClick('_side')" class="${thCls('_side')}">Vehicle</th>
    <th onclick="thClick('start_time')" class="${thCls('start_time')}">Start</th>
    <th onclick="thClick('end_time')" class="${thCls('end_time')}">End</th>
    <th onclick="thClick('duration')" class="${thCls('duration')}">Duration</th>
    <th onclick="thClick('gps_count')" class="${thCls('gps_count')}">GPS</th>
    <th onclick="thClick('distance')" class="${thCls('distance')}">ODO Dist</th>
    <th onclick="thClick('fuel_consumed')" class="${thCls('fuel_consumed')}">Fuel</th>
    <th onclick="thClick('max_speed')" class="${thCls('max_speed')}">Max Spd</th>
    <th onclick="thClick('avg_speed')" class="${thCls('avg_speed')}">Avg Spd</th>
    <th></th>
  </tr>`;

  const tbody = rows.map((r, i) => {
    const startStr = r.start_time ? new Date(r.start_time).toLocaleString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit',second:'2-digit'}) : '—';
    const endStr   = r.end_time   ? new Date(r.end_time).toLocaleString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit',second:'2-digit'}) : '—';
    const durMs = tripDurMs(r);
    const dur  = durMs > 0 ? fmtDurMs(durMs) : '—';
    const gps  = r.gps_count ?? r.gps_points ?? r.total_gps ?? r.point_count ?? null;
    const gpsStr = gps != null ? String(gps) : '—';
    const dist = tripDistKm(r);
    const fuelRaw = r.fuel_consumed ?? r.fuel ?? r.total_fuel ?? r.fuel_used ?? null;
    const fuel = fuelRaw != null ? Number(fuelRaw).toFixed(2) + ' L' : '—';
    const maxSpd = r.max_speed != null ? r.max_speed + ' km/h' : '—';
    const avgSpd = r.avg_speed != null ? r.avg_speed + ' km/h' : '—';
    return `<tr>
      <td class="${r._side}">${r._side.toUpperCase()}</td>
      <td class="mono" title="${r.start_time}">${startStr}</td>
      <td class="mono" title="${r.end_time}">${endStr}</td>
      <td>${dur}</td>
      <td>${gpsStr}</td>
      <td>${dist}</td>
      <td>${fuel}</td>
      <td>${maxSpd}</td>
      <td>${avgSpd}</td>
      <td><span class="exp-btn" onclick="toggleExp(this,${i})">{…}</span></td>
    </tr>
    <tr class="exp-row" id="exp-${i}" style="display:none"><td colspan="10"><pre class="exp-pre">${escHtml(JSON.stringify(r, null, 2))}</pre></td></tr>`;
  }).join('');

  setTable(thead, tbody);
  setFtrInfo(rows.length + ' trips shown (' + srcTrips.length + ' SRC, ' + tgtTrips.length + ' TGT)');
}

// ── Alerts ────────────────────────────────────────────────────
function renderAlerts(srcAlerts, tgtAlerts, srcByType, tgtByType) {
  const allTypes = [...new Set([...Object.keys(srcByType), ...Object.keys(tgtByType)])].sort();

  // Build type filter chips
  const isAll = _activeTypes === null;
  document.getElementById('tfAll').classList.toggle('on', isAll);
  if (allTypes.length) {
    document.getElementById('bkdGrid').innerHTML = allTypes.map(type => {
      const s = srcByType[type]||0, tv = tgtByType[type]||0, d = tv - s;
      const dcls = d === 0 ? 'ok' : Math.abs(d) <= 1 ? 'warn' : 'bad';
      const sel = isAll || (_activeTypes && _activeTypes.has(type));
      return `<div class="bkd-row${sel?' sel':''}" onclick="toggleTypeFilter('${type}')">
        <span class="bkd-type">${fmtAlertType(type)}</span>
        <span class="bkd-src">${s}</span><span class="bkd-sep">·</span><span class="bkd-tgt">${tv}</span>
        <span class="bkd-d ${dcls}">${d===0?'✓':(d>0?'+':'')+d}</span></div>`;
    }).join('');
  }

  let rows = [
    ...srcAlerts.map(r => ({ ...r, _side: 'src' })),
    ...tgtAlerts.map(r => ({ ...r, _side: 'tgt' })),
  ];
  rows = rows.filter(r => {
    if (!_showSrc && r._side === 'src') return false;
    if (!_showTgt && r._side === 'tgt') return false;
    const rtype = r.type || r.alert_type || '';
    if (_activeTypes && !_activeTypes.has(rtype)) return false;
    if (_search) {
      const hay = JSON.stringify(r).toLowerCase();
      if (!hay.includes(_search)) return false;
    }
    return true;
  });
  rows = sortRows(rows, _sortCol || 'timestamp');
  if (!rows.length && !allTypes.length) { showEmpty(); return; }

  const thead = `<tr>
    <th onclick="thClick('_side')" class="${thCls('_side')}">Vehicle</th>
    <th onclick="thClick('type')" class="${thCls('type')}">Type</th>
    <th onclick="thClick('timestamp')" class="${thCls('timestamp')}">Time</th>
    <th onclick="thClick('duration')" class="${thCls('duration')}">Duration</th>
    <th onclick="thClick('max_speed')" class="${thCls('max_speed')}">Max Spd</th>
    <th onclick="thClick('avg_speed')" class="${thCls('avg_speed')}">Avg Spd</th>
    <th onclick="thClick('severity')" class="${thCls('severity')}">Severity</th>
    <th></th>
  </tr>`;

  const tbody = rows.map((r, i) => {
    const ts  = r.timestamp ? new Date(r.timestamp).toLocaleString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit',second:'2-digit'}) : '—';
    const typ = fmtAlertType(r.type || r.alert_type || '—');
    const durMs = (r.duration_ms != null && r.duration_ms > 0) ? r.duration_ms
                : (r.duration != null && r.duration > 0) ? r.duration * 1000 : 0;
    const dur = durMs > 0 ? fmtDurMs(durMs) : '—';
    const maxSpd = r.max_speed != null ? r.max_speed + ' km/h' : (r.speed != null ? r.speed + ' km/h' : '—');
    const avgSpd = r.avg_speed != null ? r.avg_speed + ' km/h' : '—';
    const sev = r.severity ?? r.priority ?? '—';
    return `<tr>
      <td class="${r._side}">${r._side.toUpperCase()}</td>
      <td>${typ}</td>
      <td class="mono" title="${r.timestamp}">${ts}</td>
      <td>${dur}</td>
      <td>${maxSpd}</td>
      <td>${avgSpd}</td>
      <td>${sev}</td>
      <td><span class="exp-btn" onclick="toggleExp(this,${i})">{…}</span></td>
    </tr>
    <tr class="exp-row" id="exp-${i}" style="display:none"><td colspan="8"><pre class="exp-pre">${escHtml(JSON.stringify(r, null, 2))}</pre></td></tr>`;
  }).join('');

  setTable(thead, tbody);
  setFtrInfo(rows.length + ' alerts shown (' + srcAlerts.length + ' SRC, ' + tgtAlerts.length + ' TGT)');
}

// ── DTCs ──────────────────────────────────────────────────────
function renderDtcs(srcActive, srcInactive, tgtActive, tgtInactive) {
  function buildRows(items, side, status) {
    return items.map(r => ({ ...r, _side: side, _status: status }));
  }
  let rows = [
    ...buildRows(srcActive,   'src', 'active'),
    ...buildRows(srcInactive, 'src', 'inactive'),
    ...buildRows(tgtActive,   'tgt', 'active'),
    ...buildRows(tgtInactive, 'tgt', 'inactive'),
  ];
  rows = rows.filter(r => {
    if (!_showSrc && r._side === 'src') return false;
    if (!_showTgt && r._side === 'tgt') return false;
    if (_search) {
      const hay = JSON.stringify(r).toLowerCase();
      if (!hay.includes(_search)) return false;
    }
    return true;
  });
  rows = sortRows(rows, _sortCol || 'timestamp');
  if (!rows.length) { showEmpty(); return; }

  const thead = `<tr>
    <th onclick="thClick('_side')" class="${thCls('_side')}">Vehicle</th>
    <th onclick="thClick('_status')" class="${thCls('_status')}">Status</th>
    <th onclick="thClick('code')" class="${thCls('code')}">Code</th>
    <th onclick="thClick('timestamp')" class="${thCls('timestamp')}">Time</th>
    <th onclick="thClick('protocol')" class="${thCls('protocol')}">Protocol</th>
    <th>Description</th>
    <th></th>
  </tr>`;

  const tbody = rows.map((r, i) => {
    const ts    = r.timestamp ? new Date(r.timestamp).toLocaleString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit',second:'2-digit'}) : '—';
    const code  = r.code || r.dtc_code || r.dtc || '—';
    const proto = r.protocol || '—';
    const desc  = r.description || r.desc || '';
    const stCls = r._status === 'active' ? 'bad' : 'match';
    return `<tr>
      <td class="${r._side}">${r._side.toUpperCase()}</td>
      <td class="${stCls}">${r._status}</td>
      <td class="mono">${code}</td>
      <td class="mono" title="${r.timestamp}">${ts}</td>
      <td>${proto}</td>
      <td title="${escHtml(desc)}">${escHtml(desc.slice(0,60))}${desc.length>60?'…':''}</td>
      <td><span class="exp-btn" onclick="toggleExp(this,${i})">{…}</span></td>
    </tr>
    <tr class="exp-row" id="exp-${i}" style="display:none"><td colspan="7"><pre class="exp-pre">${escHtml(JSON.stringify(r, null, 2))}</pre></td></tr>`;
  }).join('');

  setTable(thead, tbody);
  const srcTotal = srcActive.length + srcInactive.length, tgtTotal = tgtActive.length + tgtInactive.length;
  setFtrInfo(rows.length + ' DTCs shown (' + srcTotal + ' SRC [' + srcActive.length + ' active, ' + srcInactive.length + ' inactive], ' +
    tgtTotal + ' TGT [' + tgtActive.length + ' active, ' + tgtInactive.length + ' inactive])');
}

// ── DOM helpers ───────────────────────────────────────────────
function setTable(thead, tbody) {
  const wrap = document.getElementById('tblWrap');
  wrap.innerHTML = `<table class="dtbl"><thead>${thead}</thead><tbody>${tbody}</tbody></table>`;
}

function showEmpty() {
  document.getElementById('tblWrap').innerHTML = `<div class="empty"><div class="empty-icon">◎</div><span>No data for this tab / filter</span></div>`;
  setFtrInfo('0 rows');
}

function setFtrInfo(text) { document.getElementById('ftrInfo').textContent = text; }

function toggleExp(btn, idx) {
  const row = document.getElementById('exp-' + idx);
  if (!row) return;
  const show = row.style.display === 'none';
  row.style.display = show ? '' : 'none';
  btn.textContent = show ? '{✕}' : '{…}';
}

function escHtml(s) {
  if (s == null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function fmtMs(s) {
  if (!s) return '—';
  const d = new Date(s);
  return isNaN(d.getTime()) ? s : d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'2-digit'});
}

function fmtDurMs(ms) {
  if (!ms || ms <= 0) return '—';
  const h = Math.floor(ms/3600000), m = Math.floor((ms%3600000)/60000), s = Math.floor((ms%60000)/1000);
  return h > 0 ? h+'h '+m+'m' : m > 0 ? m+'m '+s+'s' : s+'s';
}

function fmtAlertType(t) {
  if (!t) return '—';
  return t.replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase());
}

// ── Re-check ─────────────────────────────────────────────────
async function reCheck() {
  const t = SimState.getActiveTest(), r = SimState.getRegion(SimState.getActiveRegionKey());
  if (!t || !r || !r.userToken) return;
  const sd = s => { if (!s) return 0; const d = new Date(s); return isNaN(d.getTime()) ? 0 : d.getTime(); };
  const _snapEod = ms => { const d = new Date(ms); return (d.getHours()||d.getMinutes()||d.getSeconds()) ? ms : ms + 86399999; };
  const fromMs = sd(t.from), toMs = sd(t.until), toMsEod = _snapEod(toMs);
  if (!fromMs || !toMs) return;
  document.getElementById('reCheckBtn').disabled = true;
  document.getElementById('phSpinner').classList.add('on');
  try {
    const cfg = {
      apiBase: r.apiBase||'', userToken: r.userToken||'', accId: r.accId||'',
      srcImei: t.srcImei||'', tgtImei: t.tgtImei||'',
      fromMs, toMs, toMsEod,
    };
    const raw = await window.go.main.App.ValidateSimulation(cfg);
    _result = JSON.parse(raw);
    localStorage.setItem('sim_val_result', raw);
    applyResult();
    renderTab();
  } catch(e) {
    document.getElementById('errBanner').style.display = '';
    document.getElementById('errBanner').textContent = 'Re-check failed: ' + String(e);
  } finally {
    document.getElementById('reCheckBtn').disabled = false;
    document.getElementById('phSpinner').classList.remove('on');
  }
}

// ── Export ────────────────────────────────────────────────────
async function exportData(fmt) {
  if (!_result) return;
  const src = _result.src||{}, tgt = _result.tgt||{};
  let rows = [], headers = [];
  if (_activeTab === 'trips') {
    rows = [
      ...(src.trips||[]).map(r=>({_side:'SRC',...r})),
      ...(tgt.trips||[]).map(r=>({_side:'TGT',...r})),
    ];
    headers = ['_side','start_time','end_time','duration','gps_count','distance','fuel_consumed','max_speed','avg_speed','id'];
  } else if (_activeTab === 'alerts') {
    rows = [
      ...(src.alerts||[]).map(r=>({_side:'SRC',...r})),
      ...(tgt.alerts||[]).map(r=>({_side:'TGT',...r})),
    ];
    headers = ['_side','type','timestamp','duration','max_speed','avg_speed','severity','message','id'];
  } else {
    rows = [
      ...(src.dtcsActive||[]).map(r=>({_side:'SRC',_status:'active',...r})),
      ...(src.dtcsInactive||[]).map(r=>({_side:'SRC',_status:'inactive',...r})),
      ...(tgt.dtcsActive||[]).map(r=>({_side:'TGT',_status:'active',...r})),
      ...(tgt.dtcsInactive||[]).map(r=>({_side:'TGT',_status:'inactive',...r})),
    ];
    headers = ['_side','_status','code','timestamp','protocol','description'];
  }
  let content = '', ext = fmt;
  if (fmt === 'json') {
    content = JSON.stringify(rows, null, 2);
  } else {
    const keys = headers.length ? headers : (rows[0] ? Object.keys(rows[0]) : []);
    const esc = v => { const s = v==null?'':String(v); return s.includes(',')||s.includes('"')||s.includes('\n') ? '"'+s.replace(/"/g,'""')+'"' : s; };
    content = keys.join(',') + '\n' + rows.map(r => keys.map(k => esc(r[k])).join(',')).join('\n');
  }
  try {
    const t = SimState.getActiveTest();
    const name = (t ? t.name.replace(/[^a-z0-9]+/gi,'-') : 'validate') + '-' + _activeTab + '.' + ext;
    await window.go.main.App.SaveFile(content, name);
  } catch(e) { alert('Export failed: ' + e); }
}

// ── Init ──────────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', () => {
  SimNav.inject('run'); // highlight "Run" nav item since this is a run sub-page
  SimState.applyTheme();
  loadResult();
  if (!_result) {
    document.getElementById('phSub').textContent = 'No data — run a Check from the Validate tab first';
  }
  renderTab();
});
</script>
