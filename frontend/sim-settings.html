<!DOCTYPE html>
<html lang="en">
<head>
<script src="/wails/ipc.js"></script>
<script src="/wails/runtime.js"></script>
<meta charset="UTF-8">
<title>Settings — Device Simulator</title>
<script src="sim-state.js"></script>
<script src="sim-nav.js"></script>
<link rel="stylesheet" href="flatpickr-dark.css">
<script src="flatpickr.min.js"></script>
<style>
.app-wrap{flex-direction:row!important}
.cfg-sidebar{width:210px;min-width:210px;background:var(--bg1);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto;flex-shrink:0}
.cfg-sidebar::-webkit-scrollbar{width:3px}.cfg-sidebar::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.cfg-main{flex:1;overflow-y:auto;padding:20px 24px}
.cfg-main::-webkit-scrollbar{width:4px}.cfg-main::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.cfgs-sec{border-bottom:1px solid var(--border);padding-bottom:4px;margin-bottom:0}
.cfgs-sec-hdr{padding:10px 12px 6px;font-size:9px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--t1)}
.cfgs-item{padding:7px 12px;cursor:pointer;display:flex;align-items:center;gap:8px;font-size:11px;color:var(--t1);border-left:3px solid transparent;transition:all .12s}
.cfgs-item:hover{background:var(--bg2);color:var(--t0)}
.cfgs-item.on{background:rgba(167,139,250,.07);color:var(--t0);border-left-color:var(--blue)}
.cfgs-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.cfgs-sub{font-size:9px;color:var(--t2);margin-left:auto}
.page-hdr{display:flex;align-items:center;gap:12px;margin-bottom:22px;padding-bottom:14px;border-bottom:1px solid var(--border)}
.page-title{font-size:16px;font-weight:700;color:var(--t0)}
.page-sub{font-size:11px;color:var(--t1)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 20px}
.form-grid .fg{grid-column:span 1}
.form-grid .fg.wide{grid-column:span 2}
.section-title{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--t1);margin:18px 0 10px;padding-bottom:5px;border-bottom:1px solid var(--border)}
.section-title:first-child{margin-top:0}
.sl-row{display:flex;align-items:center;gap:8px}
.sl{flex:1;accent-color:var(--blue)}
.slv{font-size:10px;color:var(--blue);min-width:60px;text-align:right;font-family:monospace}
.rg{display:flex;flex-direction:column;gap:5px}
.ri{display:flex;align-items:center;gap:7px;font-size:11px;cursor:pointer;color:var(--t1)}.ri:hover{color:var(--t0)}.ri input{accent-color:var(--blue)}
.test-actions{display:flex;gap:7px;margin-top:16px;padding-top:14px;border-top:1px solid var(--border)}
.btn-danger{background:rgba(248,113,113,.1);color:var(--red);border:1px solid rgba(248,113,113,.25)}.btn-danger:hover{background:rgba(248,113,113,.2)}
.saved-chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;background:rgba(52,211,153,.1);border:1px solid rgba(52,211,153,.25);border-radius:4px;color:var(--green);font-size:9px;font-weight:700;opacity:0;transition:opacity .3s}
.saved-chip.show{opacity:1}
.reset-bar{margin-top:30px;padding:14px;background:rgba(248,113,113,.05);border:1px solid rgba(248,113,113,.15);border-radius:8px;display:flex;align-items:center;justify-content:space-between}
.reset-lbl{font-size:11px;color:var(--t1)}.reset-lbl strong{color:var(--red)}
/* Appearance quick-picker */
.qtheme-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:6px;margin-top:6px}
.qtheme-card{border:2px solid var(--border);border-radius:7px;padding:7px 8px;cursor:pointer;transition:all .14s}
.qtheme-card:hover{border-color:var(--t2);background:var(--bg2)}
.qtheme-card.on{border-color:var(--blue);background:rgba(167,139,250,.07)}
.qtheme-card.on::after{content:'✓';float:right;font-size:9px;font-weight:700;color:var(--blue)}
.qtheme-swatches{display:flex;gap:2px;margin-bottom:5px}
.qtheme-swatches span{width:13px;height:13px;border-radius:2px;flex-shrink:0;display:inline-block}
/* ── Flatpickr overrides ── */
.flatpickr-calendar{background:var(--bg1)!important;box-shadow:0 8px 32px rgba(0,0,0,.7),0 0 0 1px var(--border)!important;border-radius:8px!important;font-family:var(--font-ui)!important}
.flatpickr-calendar.arrowTop:before{border-bottom-color:var(--border)!important}.flatpickr-calendar.arrowTop:after{border-bottom-color:var(--bg2)!important}
.flatpickr-calendar.arrowBottom:before{border-top-color:var(--border)!important}.flatpickr-calendar.arrowBottom:after{border-top-color:var(--bg1)!important}
.flatpickr-months{background:var(--bg2)!important;border-radius:7px 7px 0 0}
.flatpickr-months .flatpickr-month{background:transparent!important;color:var(--t0)!important;fill:var(--t0)!important}
.flatpickr-months .flatpickr-prev-month:hover svg,.flatpickr-months .flatpickr-next-month:hover svg{fill:var(--blue)!important}
.flatpickr-current-month{color:var(--t0)!important}.flatpickr-current-month input.cur-year{color:var(--t0)!important}
.flatpickr-current-month .flatpickr-monthDropdown-months{background:var(--bg2)!important;color:var(--t0)!important}
.flatpickr-weekdays{background:var(--bg1)!important}
span.flatpickr-weekday{background:transparent!important;color:var(--t2)!important;font-size:9px!important;font-weight:700!important;letter-spacing:.05em!important}
.flatpickr-days,.dayContainer{border:none!important}
.flatpickr-day{color:var(--t1)!important;border:none!important;border-radius:5px!important;font-size:11px!important}
.flatpickr-day:hover{background:var(--bg3)!important;color:var(--t0)!important}
.flatpickr-day.today{border:1px solid var(--blue)!important;font-weight:700}
.flatpickr-day.today:hover,.flatpickr-day.selected,.flatpickr-day.selected:hover{background:var(--blue)!important;border-color:var(--blue)!important;color:#09080e!important;font-weight:700!important}
.flatpickr-day.disabled,.flatpickr-day.prevMonthDay,.flatpickr-day.nextMonthDay{color:var(--border)!important}
.flatpickr-time{background:var(--bg2)!important;border-top:1px solid var(--border)!important;border-radius:0 0 7px 7px!important}
.flatpickr-time input{background:var(--bg1)!important;color:var(--t0)!important;border-radius:4px!important;font-size:12px!important;font-family:var(--font-mono)!important}
.flatpickr-time input:hover,.flatpickr-time input:focus{background:var(--bg3)!important}
.flatpickr-time .flatpickr-time-separator{color:var(--t2)!important}
.numInputWrapper span{border-color:var(--border)!important}.numInputWrapper span svg path{fill:var(--t2)!important}
.numInputWrapper:hover{background:var(--bg3)!important}
input.flatpickr-alt-input[readonly]{cursor:pointer}
/* Interface panel */
.if-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.if-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.if-card{border:2px solid var(--border);border-radius:8px;padding:10px 12px;cursor:pointer;transition:all .15s;position:relative}
.if-card:hover{border-color:var(--t2);background:var(--bg2)}
.if-card.on{border-color:var(--blue);background:rgba(167,139,250,.06)}
.if-card.on::after{content:'✓';position:absolute;top:5px;right:8px;font-size:10px;font-weight:700;color:var(--blue)}
.if-preview{margin-bottom:8px;display:flex;align-items:center;gap:4px;pointer-events:none;min-height:28px}
.if-name{font-size:10px;font-weight:700;color:var(--t0)}
.if-sub{font-size:8px;color:var(--t2);margin-top:2px}
</style>
</head>
<body>
<div class="app-wrap">
  <!-- sidebar: section nav + tests -->
  <div class="cfg-sidebar">
    <div class="cfgs-sec">
      <div class="cfgs-item on" id="nav-region" onclick="showPanel('region')">
        <div class="cfgs-dot" id="navRegionDot"></div><span id="navRegionName">Region</span>
      </div>
      <div class="cfgs-item" id="nav-global" onclick="showPanel('global')">
        <span>⚙</span><span>Global Settings</span>
      </div>
      <div class="cfgs-item" id="nav-appearance" onclick="showPanel('appearance')">
        <span>◈</span><span>Appearance</span>
      </div>
      <div class="cfgs-item" id="nav-interface" onclick="showPanel('interface')">
        <span>⊞</span><span>Interface</span>
      </div>
    </div>
    <div class="cfgs-sec">
      <div class="cfgs-sec-hdr">Test Profiles</div>
      <div id="testItems"></div>
      <div style="padding:6px 12px 10px">
        <button class="btn btn-ghost" style="width:100%;font-size:10px" onclick="newTest()">+ New Test Profile</button>
      </div>
    </div>
  </div>

  <!-- main form area -->
  <div class="cfg-main" id="cfgMain"></div>
</div>

<script>
let curPanel = 'region';

function init() {
  SimNav.inject('settings');
  renderSidebarTests();
  updateRegionLabel();
  showPanel('region');
}

window.onRegionChange = function() {
  updateRegionLabel();
  if (curPanel === 'region') renderRegionForm(SimState.getActiveRegionKey());
};

function updateRegionLabel() {
  const key = SimState.getActiveRegionKey();
  const r = SimState.getRegion(key) || {};
  const dot = document.getElementById('navRegionDot');
  const name = document.getElementById('navRegionName');
  if (dot) dot.style.background = r.color || 'var(--t2)';
  if (name) name.textContent = r.label || key;
}

function renderSidebarTests() {
  const tests = SimState.getTests();
  document.getElementById('testItems').innerHTML = tests.map(t => {
    const r = SimState.getRegion(t.regionKey) || {};
    return `<div class="cfgs-item${curPanel==='test:'+t.id?' on':''}" id="nav-test-${t.id}" onclick="showPanel('test:${t.id}')">
      <div class="cfgs-dot" style="background:${r.color||'var(--t2)'}"></div>
      <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${t.name}</span>
      <span class="cfgs-sub">${SimNav.regionShort(t.regionKey)}</span>
    </div>`;
  }).join('');
}

function showPanel(key) {
  curPanel = key;
  renderSidebarTests();
  document.querySelectorAll('.cfgs-item').forEach(el => el.classList.remove('on'));
  const navEl = document.getElementById('nav-' + key.replace(':','-'));
  if (navEl) navEl.classList.add('on');
  if (key === 'region') { document.getElementById('nav-region').classList.add('on'); renderRegionForm(SimState.getActiveRegionKey()); }
  else if (key === 'global') renderGlobalForm();
  else if (key === 'appearance') renderAppearanceForm();
  else if (key === 'interface') renderInterfaceForm();
  else if (key.startsWith('test:')) renderTestForm(parseInt(key.split(':')[1]));
}

// ── Region form ────────────────────────────────────────────────
function renderRegionForm(regionKey) {
  const r = SimState.getRegion(regionKey);
  if (!r) return;
  const main = document.getElementById('cfgMain');
  main.innerHTML = `
    <div class="page-hdr">
      <div class="cfgs-dot" style="background:${r.color};width:10px;height:10px;border-radius:50%"></div>
      <div>
        <div class="page-title">${r.label}</div>
        <div class="page-sub">${r.sub} — all credentials and endpoints for this region</div>
      </div>
      <span class="saved-chip" id="savedChip">✓ Saved</span>
    </div>

    <div class="section-title">Credentials</div>
    <div class="form-grid">
      <div class="fg wide"><label class="lbl">API Token</label><input class="inp" type="password" id="f-apiToken" value="${r.apiToken}" placeholder="Intangles API token" oninput="patchRegion('${regionKey}','apiToken',this.value)"></div>
      <div class="fg"><label class="lbl">User Token <span style="color:var(--t2);font-size:8px">for validate / data APIs</span></label><input class="inp" type="password" id="f-userToken" value="${r.userToken}" placeholder="Intangles-User-Token header value" oninput="patchRegion('${regionKey}','userToken',this.value)"></div>
      <div class="fg"><label class="lbl">Account ID <span style="color:var(--t2);font-size:8px">acc_id query param</span></label><input class="inp" id="f-accId" value="${r.accId||''}" placeholder="e.g. 1606685851746566144" oninput="patchRegion('${regionKey}','accId',this.value)"></div>
      <div class="fg"><label class="lbl">Session Token</label>
        <div class="inp-row">
          <input class="inp" id="f-sessionToken" value="${r.sessionToken}" placeholder="Session token" oninput="patchRegion('${regionKey}','sessionToken',this.value)">
          <button class="ibtn" onclick="regenSession('${regionKey}')">Regen</button>
        </div>
      </div>
    </div>

    <div class="section-title">MQTT — TLS (mqtts://)</div>
    <div class="form-grid">
      <div class="fg"><label class="lbl">Protocol</label>
        <select class="inp" id="f-mqttProtocol" onchange="patchRegion('${regionKey}','mqttProtocol',this.value)">
          <option value="mqtts"${(r.mqttProtocol||'mqtts')==='mqtts'?' selected':''}>mqtts:// (TLS, port 8884)</option>
          <option value="mqtt"${r.mqttProtocol==='mqtt'?' selected':''}>mqtt:// (plain, port 1883)</option>
        </select>
      </div>
      <div class="fg"><label class="lbl">Port</label><input class="inp" type="number" id="f-mqttPort" value="${r.mqttPort}" oninput="patchRegion('${regionKey}','mqttPort',+this.value)"></div>
      <div class="fg wide"><label class="lbl">Broker Host (TLS)</label><input class="inp" id="f-mqttBroker" value="${r.mqttBroker||''}" oninput="patchRegion('${regionKey}','mqttBroker',this.value)"></div>
      <div class="fg"><label class="lbl">TLS Certs</label>
        <select class="inp" id="f-tlsCerts" onchange="patchRegion('${regionKey}','tlsCerts',this.value)">
          <option value="embedded"${r.tlsCerts==='embedded'?' selected':''}>Embedded Certs</option>
          <option value="directory"${r.tlsCerts==='directory'?' selected':''}>Load from Directory</option>
        </select>
      </div>
      <div class="fg wide"><label class="lbl">MQTT Username <span style="color:var(--t2);font-size:8px">optional — leave blank if TLS cert auth is enough</span></label><input class="inp" id="f-mqttUsername" value="${r.mqttUsername||''}" placeholder="device IMEI or broker username" oninput="patchRegion('${regionKey}','mqttUsername',this.value)"></div>
      <div class="fg wide" style="display:flex;align-items:flex-end;gap:8px">
        <input class="inp" id="f-mqttTestImei" value="" placeholder="Device IMEI for test connection" style="flex:1">
        <button class="ibtn" style="flex-shrink:0" onclick="testMqtt('${regionKey}')">⚡ Test TLS</button>
      </div>
      <div class="fg wide"><div id="mqttResult" style="font-size:10px;color:var(--t2)"></div></div>
    </div>

    <div class="section-title">MQTT — Plain TCP (mqtt://)</div>
    <div class="form-grid">
      <div class="fg wide"><label class="lbl">Broker Host (plain) <span style="color:var(--t2);font-size:8px">leave blank if not available</span></label><input class="inp" id="f-mqttBrokerPlain" value="${r.mqttBrokerPlain||''}" placeholder="mqtt.region.intangles.com (not mqttsecure)" oninput="patchRegion('${regionKey}','mqttBrokerPlain',this.value)"></div>
      <div class="fg"><label class="lbl">Port <span style="color:var(--t2);font-size:8px">default 1883</span></label><input class="inp" type="number" id="f-mqttPortPlain" value="${r.mqttPortPlain||1883}" placeholder="1883" oninput="patchRegion('${regionKey}','mqttPortPlain',+this.value)"></div>
    </div>

    <div class="section-title">API &amp; HTTP Upload</div>
    <div class="form-grid">
      <div class="fg wide"><label class="lbl">API Base URL <span style="color:var(--t2);font-size:8px">used by Data Logs page</span></label><input class="inp" id="f-apiBase" value="${r.apiBase||''}" oninput="patchRegion('${regionKey}','apiBase',this.value)"></div>
      <div class="fg wide"><label class="lbl">Upload URL</label><input class="inp" id="f-uploadUrl" value="${r.uploadUrl}" oninput="patchRegion('${regionKey}','uploadUrl',this.value)"></div>
    </div>

    <div class="section-title">RabbitMQ</div>
    <div class="form-grid">
      <div class="fg"><label class="lbl">Host</label><input class="inp" id="f-rmqHost" value="${r.rmqHost}" oninput="patchRegion('${regionKey}','rmqHost',this.value)"></div>
      <div class="fg"><label class="lbl">Queue</label><input class="inp" id="f-rmqQueue" value="${r.rmqQueue}" oninput="patchRegion('${regionKey}','rmqQueue',this.value)"></div>
      <div class="fg"><label class="lbl">Compression</label>
        <select class="inp" id="f-rmqCompression" onchange="patchRegion('${regionKey}','rmqCompression',this.value)">
          <option value="gzip"${r.rmqCompression==='gzip'?' selected':''}>gzip</option>
          <option value="none"${r.rmqCompression==='none'?' selected':''}>none</option>
        </select>
      </div>
    </div>

    <div class="section-title">Encryption</div>
    <div class="form-grid">
      <div class="fg">
        <div class="tg-row"><span class="tg-lbl">Encrypt Payloads</span><div class="tg${r.encryptEnabled?' on':''}" id="f-encryptEnabled" onclick="toggleEncrypt('${regionKey}',this)"></div></div>
      </div>
      <div class="fg"><label class="lbl">AES Version</label>
        <select class="inp" id="f-aesVersion" onchange="patchRegion('${regionKey}','aesVersion',this.value)">
          <option value="2"${r.aesVersion==='2'?' selected':''}>v2 — AES-256-ECB</option>
          <option value="1"${r.aesVersion==='1'?' selected':''}>v1 — AES-128-ECB</option>
        </select>
      </div>
      <div class="fg"><label class="lbl">RSA Public Key</label>
        <select class="inp" id="f-rsaKey" onchange="patchRegion('${regionKey}','rsaKey',this.value)">
          <option value="embedded"${r.rsaKey==='embedded'?' selected':''}>Embedded (built-in)</option>
          <option value="file"${r.rsaKey==='file'?' selected':''}>Load from File</option>
        </select>
      </div>
    </div>
  `;
}

function patchRegion(key, field, val) {
  SimState.setRegion(key, { [field]: val });
  flashSaved();
}

function toggleEncrypt(key, el) {
  el.classList.toggle('on');
  SimState.setRegion(key, { encryptEnabled: el.classList.contains('on') });
  flashSaved();
}

function regenSession(key) {
  const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
  const tok = Array.from({ length: 30 }, () => chars[Math.floor(Math.random() * chars.length)]).join('');
  SimState.setRegion(key, { sessionToken: tok });
  const el = document.getElementById('f-sessionToken');
  if (el) el.value = tok;
  flashSaved();
}

async function testMqtt(key) {
  const el = document.getElementById('mqttResult');
  if (!el) return;
  const r = SimState.getRegion(key) || {};
  // Use typed test IMEI, or fall back to first test with a tgtImei for this region
  const imeiInput = document.getElementById('f-mqttTestImei');
  let tgtImei = (imeiInput && imeiInput.value.trim()) || '';
  if (!tgtImei) {
    const t = (SimState.getTests() || []).find(t => t.regionKey === key && t.tgtImei);
    tgtImei = (t && t.tgtImei) || '';
  }
  if (!tgtImei) {
    el.style.color = 'var(--yellow)'; el.textContent = '⚠ Enter a Device IMEI in the test field above';
    return;
  }
  el.style.color = 'var(--t2)'; el.textContent = 'Testing…';
  try {
    const result = await window.go.main.App.TestMQTT({
      mqttProtocol: r.mqttProtocol || 'mqtts',
      mqttBroker:   r.mqttBroker   || '',
      mqttPort:     r.mqttPort     || 8884,
      tlsCerts:     r.tlsCerts     || 'embedded',
      tgtImei:      tgtImei,
      mqttUsername: r.mqttUsername || '',
    });
    if (result && result.ok) {
      el.style.color = 'var(--green)'; el.textContent = '✓ ' + (result.message || 'Connected');
    } else {
      el.style.color = 'var(--red)'; el.textContent = '✗ ' + (result && result.message || 'Failed');
    }
  } catch(err) {
    el.style.color = 'var(--red)'; el.textContent = '✗ ' + String(err).replace(/^Error:\s*/i,'');
  }
}

// ── Global form ────────────────────────────────────────────────
function renderGlobalForm() {
  const g = SimState.getGlobal();
  document.getElementById('cfgMain').innerHTML = `
    <div class="page-hdr">
      <div><div class="page-title">Global Settings</div><div class="page-sub">Simulation timing, batching — apply to all regions</div></div>
      <span class="saved-chip" id="savedChip">✓ Saved</span>
    </div>

    <div class="section-title">Batch &amp; API</div>
    <div class="form-grid">
      <div class="fg"><label class="lbl">Batch Size (records/file)</label><input class="inp" type="number" id="g-batchSize" value="${g.batchSize}" min="1" oninput="patchGlobal('batchSize',+this.value)"></div>
      <div class="fg"><label class="lbl">API Page Size</label><input class="inp" type="number" id="g-apiPageSize" value="${g.apiPageSize}" min="1" oninput="patchGlobal('apiPageSize',+this.value)"></div>
      <div class="fg"><label class="lbl">API Request Delay (ms)</label><input class="inp" type="number" id="g-apiRequestDelay" value="${g.apiRequestDelay}" min="0" oninput="patchGlobal('apiRequestDelay',+this.value)"></div>
      <div class="fg"><label class="lbl">Output Directory</label><input class="inp" id="g-outputDir" value="${g.outputDir}" oninput="patchGlobal('outputDir',this.value)"></div>
      <div class="fg"><label class="lbl">Max Log Entries</label><input class="inp" type="number" id="g-maxLogEntries" value="${g.maxLogEntries||1000}" min="100" max="50000" step="100" oninput="patchGlobal('maxLogEntries',+this.value)" title="Auto-trims oldest logs when this limit is reached. Default: 1000."></div>
    </div>

    <div class="section-title">Timing</div>
    <div class="fg"><label class="lbl">Batch Upload Delay</label><div class="sl-row"><input type="range" class="sl" min="1000" max="300000" step="1000" value="${g.batchUploadDelayMs}" oninput="patchGlobal('batchUploadDelayMs',+this.value);this.nextElementSibling.textContent=fmtMs(+this.value)"><span class="slv">${fmtMs(g.batchUploadDelayMs)}</span></div></div>
    <div class="fg"><label class="lbl">GPS L1 Interval (Phase 1)</label><div class="sl-row"><input type="range" class="sl" min="1000" max="60000" step="1000" value="${g.gpsL1IntervalMs}" oninput="patchGlobal('gpsL1IntervalMs',+this.value);this.nextElementSibling.textContent=fmtMs(+this.value)"><span class="slv">${fmtMs(g.gpsL1IntervalMs)}</span></div></div>

    <div class="page-hdr">
      <div><div class="page-title">Test Profile</div><div class="page-sub">Simulation parameters — credentials come from the selected region</div></div>

function patchTest(id, field, val) {
  SimState.saveTest({ id, [field]: val });
  flashSaved();
}

function autoHistEnd(id) {
  const t = SimState.getTest(id);
  if (!t || !t.from) return;
  const d = new Date(t.from);
  d.setHours(d.getHours() + 12);
  const v = d.toISOString().slice(0, 16);
  SimState.saveTest({ id, histEnd: v });
  const el = document.getElementById('t-histEnd');
  if (el) el.value = v;
  flashSaved();
}

function newTest() {
  const rk = SimState.getActiveRegionKey();
  const id = SimState.nextTestId();
  SimState.saveTest({ id, name:'New Test', regionKey:rk, srcImei:'', tgtImei:'', from:'', until:'', histEnd:'', mode:'simulate', createdAt:new Date().toISOString() });
  renderSidebarTests();
  showPanel('test:' + id);
}

function dupTest(id) {
  const t = SimState.getTest(id);
  if (!t) return;
  const newId = SimState.nextTestId();
  SimState.saveTest({ ...t, id: newId, name: t.name + '-copy', createdAt: new Date().toISOString() });
  renderSidebarTests();
  showPanel('test:' + newId);
}

function deleteTest(id) {
  if (!confirm('Delete this test profile?')) return;
  SimState.deleteTest(id);
  renderSidebarTests();
  showPanel('region');
}

function runThisTest(id) {
  SimState.setActiveTest(id);
  location.href = 'sim-run.html';
}

async function lookupVehicleId(testId, side) {
  const t = SimState.getTest(testId);
  if (!t) return;
  const r = SimState.getRegion(t.regionKey);
  if (!r || !r.apiBase || !r.userToken) {
    alert('Set API Base and User Token in the region settings first.');
    return;
  }
  const imei = side === 'src' ? t.srcImei : t.tgtImei;
  if (!imei) { alert('Set the ' + side + ' IMEI first.'); return; }
  const btnId = `lookup-${side}-${testId}`;
  const btn = document.getElementById(btnId);
  if (btn) { btn.disabled = true; btn.textContent = '…'; }
  try {
    const raw = await window.go.main.App.LookupVehicleId(r.apiBase, r.userToken, imei);
    const res = JSON.parse(raw);
    if (res.error) { alert('Lookup failed: ' + res.error); return; }
    const vidField = side === 'src' ? 'srcVehicleId' : 'tgtVehicleId';
    SimState.saveTest({ id: testId, [vidField]: res.vehicleId });
    const inp = document.getElementById('t-' + side + 'VehicleId');
    if (inp) inp.value = res.vehicleId;
    // Also save accId to region if we got it back and region doesn't have one yet
    if (res.accId && !r.accId) {
      SimState.setRegion(t.regionKey, { accId: res.accId });
      const accInp = document.getElementById('f-accId');
      if (accInp) accInp.value = res.accId;
    }
    flashSaved();
  } catch(e) { alert('Error: ' + e); } finally {
    if (btn) { btn.disabled = false; btn.textContent = 'Lookup'; }
  }
}

    <div class="section-title" style="display:flex;align-items:center">
      Quick Themes (20)
      <a href="sim-theme.html" style="margin-left:auto;font-size:9px;color:var(--blue);text-decoration:none;font-weight:400;text-transform:none;letter-spacing:0">All 44 themes + custom →</a>
    </div>
    <div class="qtheme-grid">${cards}</div>

    <div class="section-title" style="margin-top:18px">Typography</div>
    <div class="form-grid">
      <div class="fg"><label class="lbl">UI Font</label>
        <select class="inp" id="ap-ff" onchange="applyAppFont(this.value)">${uiOpts}</select>
      </div>
      <div class="fg"><label class="lbl">Mono Font</label>
        <select class="inp" id="ap-mf" onchange="applyAppMono(this.value)">${monoOpts}</select>
      </div>
      <div class="fg wide"><label class="lbl">Font Size</label>
        <div class="sl-row">
          <input type="range" class="sl" min="10" max="100" step="1" value="${curFs}" oninput="applyAppFontSize(+this.value);this.nextElementSibling.textContent=this.value+'px'">
          <span class="slv">${curFs}px</span>
        </div>
      </div>
    </div>
  `;
}

function applyQuickTheme(key) {
  const th = QUICK_THEMES.find(t => t.key === key);
  if (!th) return;
  const cur = SimState.getTheme();
  SimState.setTheme({ name:key, vars:{ ...th.vars }, fontSize:cur.fontSize||12, fontFamily:cur.fontFamily||'', monoFamily:cur.monoFamily||'', fontUrl:cur.fontUrl||'' });
  SimState.applyTheme();
  renderAppearanceForm();
  flashSaved();
}

function applyAppFont(val) {
  const fd = FONTS_UI.find(f => f.value === val);
  SimState.setTheme({ fontFamily:val, fontUrl:(fd&&fd.url)||'' });
  SimState.applyTheme();
  flashSaved();
}

function applyAppMono(val) {
  const fd = FONTS_MONO.find(f => f.value === val);
  SimState.setTheme({ monoFamily:val });
  const url = fd && fd.url;
  if (url) {
    let el = document.querySelector('link[data-simmonofont]');
    if (!el || el.getAttribute('href') !== url) {
      if (el) el.remove();
      el = document.createElement('link'); el.rel='stylesheet';
      el.setAttribute('href', url); el.setAttribute('data-simmonofont','');
      document.head.appendChild(el);
    }
  }
  SimState.applyTheme();
  flashSaved();
}

function applyAppFontSize(val) {
  SimState.setTheme({ fontSize:val });
  SimState.applyTheme();
  flashSaved();
}

// ── Utils ──────────────────────────────────────────────────────
function flashSaved() {
  const el = document.getElementById('savedChip');
  if (!el) return;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 1500);
}

function fmtMs(ms) {
  if (ms >= 60000) { const m = Math.floor(ms / 60000), s = Math.round((ms % 60000) / 1000); return m + 'm ' + (s ? String(s).padStart(2,'0') + 's' : '00s'); }
  return (ms / 1000) + 's';
}

function setIfDensity(val) {

}

  SimState.setTheme({ buttonLayout: val });
  SimState.applyTheme();
  _applyButtonLayoutToPage(val);
  renderInterfaceForm();
  flashSaved();
}

function setIfReduceMotion(el) {
  el.classList.toggle('on');
  SimState.setTheme({ reduceMotion: el.classList.contains('on') });
  SimState.applyTheme();
  flashSaved();
}

function _applyButtonLayoutToPage(layout) {
  // Nothing needed here — layout is applied on page load from theme
}

window.addEventListener('DOMContentLoaded', init);

let _fpInstances = [];
function _fpPosition(self) {
  var cal = self.calendarContainer;
  var anchor = self.altInput || self.input;
  var rect = anchor.getBoundingClientRect();
  var calH = cal.offsetHeight || 305, calW = cal.offsetWidth || 310;
  var vw = window.innerWidth, vh = window.innerHeight;
  var sx = window.scrollX || 0, sy = window.scrollY || 0;
  var spaceBelow = vh - rect.bottom - 6, spaceAbove = rect.top - 6;
  var above = spaceAbove > spaceBelow && spaceBelow < calH;
  var top = above ? rect.top + sy - calH - 4 : rect.bottom + sy + 4;
  cal.classList.toggle('arrowTop', !above);
  cal.classList.toggle('arrowBottom', above);
  top = Math.max(sy + 4, Math.min(top, sy + vh - calH - 4));
  var left = Math.max(4, Math.min(rect.left + sx, vw - calW - 4));
  cal.style.top = top + 'px';
  cal.style.left = left + 'px';
}
function initDatePickers() {
  _fpInstances.forEach(function(fp){try{fp.destroy();}catch(e){}});
  _fpInstances = [];
  document.querySelectorAll('input[type="datetime-local"]').forEach(function(el) {
    const origClass = el.className, origStyle = el.getAttribute('style')||'';
    const savedOninput = el.oninput, savedOnchange = el.onchange;
    const fp = flatpickr(el, {
      enableTime: true, time_24hr: true,
      dateFormat: 'Y-m-dTH:i', altInput: true, altFormat: 'd M Y  H:i',
      allowInput: false, defaultDate: el.value || null,
      position: _fpPosition,
      onReady: function(_,__,inst) {
        if (inst.altInput) {
          inst.altInput.className = origClass + ' flatpickr-alt-input';
          if (origStyle) inst.altInput.setAttribute('style', origStyle);
          inst.altInput.placeholder = 'Pick a date…';
        }
      },
      onChange: function() {
        const h = savedOninput || savedOnchange;
        if (h) h.call(el, {target:el});
      }
    });
    _fpInstances.push(fp);
  });
}
</script>
